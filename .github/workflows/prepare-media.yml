name: Prepare original Birdseye video
on:
  push:
    paths:
      - ".github/workflows/prepare-media.yml"
permissions:
  contents: write
jobs:
  media:
    if: github.repository == 'michaelschlunegger-creator/BirdseyeWebsite-Proto2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy original video and make a still fallback
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl --fail --location --max-time 180 --output public/media/indoor-inspection.mp4 https://birdseye.world/wp-content/uploads/2025/04/MASH-UP-superlight.mp4
          test "$(stat -c%s public/media/indoor-inspection.mp4)" -lt 95000000
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 public/media/indoor-inspection.mp4
          ffmpeg -hide_banner -loglevel error -ss 3 -i public/media/indoor-inspection.mp4 -frames:v 1 -q:v 3 public/media/indoor-inspection-poster.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media
          git commit -m "Store original drone video and static fallback for Prototype 2"
          git push origin HEAD:main
