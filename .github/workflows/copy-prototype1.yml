name: Copy preserved Prototype 1
on:
  push:
    paths:
      - ".github/workflows/copy-prototype1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    if: github.repository == 'michaelschlunegger-creator/BirdseyeWebsite-Proto2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: proto2
      - uses: actions/checkout@v4
        with:
          repository: michaelschlunegger-creator/BirdseyeWebsite
          ref: 7cd882a4df3852bcabcfa7eb5d42e588bdd50f18
          path: original
          persist-credentials: false
      - name: Preserve the exact original as a baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original rev-parse HEAD)" = "7cd882a4df3852bcabcfa7eb5d42e588bdd50f18"
          git -C original archive HEAD -- . ':!.github' | tar -x -C proto2
          cd proto2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          git commit -m "Preserve Prototype 1 source and assets from 7cd882a"
          git tag prototype-1-baseline
          git push origin HEAD:main refs/tags/prototype-1-baseline
